name: affiliate-check
on:
  push:
    paths: ["affiliate/**", ".github/workflows/affiliate.yml"]
  schedule:
    - cron: "17 0 * * 1" # 毎週月曜 09:17 JST: 広告リンク死活・情報の鮮度チェック
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: affiliate } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check.mjs
      - run: node build.mjs
